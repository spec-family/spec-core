# Dependency updates, a pull request at a time, for the devDependencies and
# the GitHub Actions the workflows pin by commit.
#
# Latest is not newest. A version waits out a cooldown before a pull request
# proposes it - a week for a patch, two for a minor, a month for a major - so a
# release that is withdrawn or compromised in its first days never lands, and
# the pins stay the newest that have been out long enough to trust. Security
# updates are not held back: the cooldown applies to version updates only.
#
# Dependabot tells a patch from a major for npm but not for GitHub Actions,
# where it ignores the semver keys: an action waits a week whatever its
# version says. `default-days` is also the wait for an npm version Dependabot
# cannot place on semver. Unset, both would wait its built-in three days.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-patch-days: 7
      semver-minor-days: 14
      semver-major-days: 30
    # Stryker's packages and vitest's move together or not at all: a runner
    # a version apart from its core is a sweep that measures nothing.
    groups:
      stryker:
        patterns:
          - '@stryker-mutator/*'
      vitest:
        patterns:
          - vitest
          - '@vitest/*'
    # @types/node follows the oldest Node that `engines` in package.json
    # admits, 22, and not the newest Node there is (ADR-0008). Under the types
    # of a later major a test or a script can call an API Node 22 does not
    # have, and the compiler passes what the oldest runtime then fails. So a
    # major is never proposed, while minors and patches of 22 still are. The
    # pin moves by hand, in the change that moves `engines`.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # vitest stays on 4 until Stryker's runner reads vitest 5 (ADR-0008,
      # amended 2026-10-07). On 5, @stryker-mutator/vitest-runner 10.0.0 runs
      # no test against a mutant a test covers, and every one survives:
      # stryker-mutator/stryker-js#6210, still open. The sweep of the bump
      # Dependabot proposed on 2026-10-06 read 4.00%, where main's reads
      # 96.36%. So a major of vitest or of an @vitest package is never
      # proposed, while minors and patches of 4 still are, and a security
      # update is not held back: `update-types` reaches version updates only.
      # These two entries go when a released @stryker-mutator/vitest-runner
      # fixes #6210 and the check ADR-0008 writes down has passed with it.
      # Until then tests/boundaries.test.ts fails a bump made by hand, and
      # says why.
      - dependency-name: vitest
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitest/*'
        update-types: ['version-update:semver-major']
    open-pull-requests-limit: 5
  # Dependabot moves the pins in .github/workflows and reads no Markdown.
  # docs/adopting.md shows a workflow with the same actions, and
  # tests/action-pins.test.ts holds each to the major the workflows here run,
  # never ahead of them. So a patch or a minor of checkout or setup-node
  # passes and leaves the guide where it was, and a major fails that test
  # until the guide follows: copy the new commit and version into its `uses:`
  # line, on Dependabot's branch. No workflow here runs upload-sarif, so no
  # bump reaches the guide's pin of it: that one follows spec-guard's ci.yml,
  # by hand, when spec-guard's moves a major.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - '*'
