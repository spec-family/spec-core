name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repository.
permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    # Headroom for a bad runner, not a budget: the slowest leg, Windows, took
    # about a minute. A job that hangs stops here rather than at GitHub's six
    # hours.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor, 24 the active LTS, 26 the current release.
        # Each image by the label that is its alone, never `-latest`, which
        # GitHub moves: these are what the three `-latest` labels gave on
        # 2026-10-07. One Ubuntu image, the gates': this suite runs nothing of
        # the image's but Node, and run 37650470030 saw it pass on Ubuntu 26.04,
        # which `ubuntu-latest` gives from 2026-10-19.
        # tests/runner-images.test.ts holds every job to a name, and ADR-0008
        # has the steps that move one.
        os: [ubuntu-24.04, windows-2025-vs2026, macos-26]
        node: ['22', '24', '26']
        # A pull request runs four of the nine legs: the floor and the current
        # release on the gates' image, and the floor on Windows and macOS. A push
        # to main, a manual run and a release (which calls this workflow) run
        # them all, so every leg still passes before a version is staged.
        # ADR-0008, amended 2026-11-12, says why.
        exclude: ${{ fromJSON(github.event_name == 'pull_request' && '[{"node":"24"},{"os":"windows-2025-vs2026","node":"26"},{"os":"macos-26","node":"26"}]' || '[]') }}
    steps:
      # Pinned to commits, with the tag beside each, as in the sibling tools.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # No dependency's install script runs: the tree needs none, npm 12 runs
      # none unless package.json allows the package, and the flag has npm 10 and
      # 11 run none either (tests/npm.test.ts).
      - run: npm ci --ignore-scripts
      - name: Type check
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test
        run: npm test

  # Coverage and the sweep stay on the image their floors and timings were
  # measured on; ADR-0008 says what moving them takes.
  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Test with coverage
        run: npm run test:coverage

  # Every module here is copied into four tools; the sweep is the gate on
  # every change, not a weekly report. One runner took 67 to 164 minutes for
  # it, so it runs in shards, each mutating its own files against every test
  # (scripts/mutation-shards.mjs), and the job after them merges the reports
  # and applies the gate once, to the merged score (ADR-0007).
  mutation-shard:
    name: mutation (shard ${{ matrix.shard }} of ${{ strategy.job-total }})
    runs-on: ubuntu-24.04
    # Headroom for a bad runner, not a budget: the shards took 2 to 9 minutes,
    # and 3 to 6.5 in the first sweep that ran a mutant's quickest test files
    # first.
    # A shard that keeps passing 15 means the table in
    # scripts/mutation-shards.mjs needs re-measuring, not this number raising.
    timeout-minutes: 30
    strategy:
      # One broken shard should not hide what the others found. The merge
      # refuses to score a sweep with a shard missing either way.
      fail-fast: false
      matrix:
        # One entry per shard in scripts/mutation-shards.mjs; a test checks.
        shard: [1, 2, 3, 4, 5, 6]
    env:
      MUTATION_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      # `--no-install`: the sweep runs the Stryker that `npm ci` installed, and
      # a job that lost that step stops here, where npx alone would fetch
      # whatever the registry has under the name. `.npmrc` says the same for
      # every command (tests/npm.test.ts).
      - name: Mutation sweep, one shard
        run: |
          started=$SECONDS
          npx --no-install stryker run stryker.shard.config.mjs
          echo "{\"seconds\": $((SECONDS - started))}" > "reports/mutation/shard-$MUTATION_SHARD.timing.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-shard-${{ matrix.shard }}
          path: reports/mutation/shard-${{ matrix.shard }}*.json
          if-no-files-found: error
          retention-days: 14

  mutation:
    name: mutation
    needs: mutation-shard
    # Runs when a shard failed too, so the failure is reported as an incomplete
    # sweep rather than as a skipped check.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      # The merge scores with Stryker's own metrics library.
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutation-shard-*
          path: reports/shards
      - name: Merge the shards and apply the gate
        run: node scripts/mutation-shards.mjs merge reports/shards
      # A score is of the mutants a sweep made, and Stryker makes none of what
      # stands under a TypeScript `as`. This counts the places a mutator would
      # have applied there, in the sources the merged report holds, and fails
      # a count above the one the script records as left (ADR-0007,
      # 2026-10-12).
      - name: Count what the sweep did not read
        run: node scripts/mutation-unmeasured.mjs reports/mutation/mutation.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation
          path: |
            reports/mutation/index.html
            reports/mutation/mutation.json
          if-no-files-found: ignore
